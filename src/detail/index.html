<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.ico" />
    <title>Drone Spot Finder | Spot Detail</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/detail.js" type="module" defer></script>
  </head>
  <body
    class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col justify-between"
  >
    <header
      class="bg-white shadow-sm sticky top-0 z-50"
      id="main-header"
    ></header>

    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
      <!-- Detail Card Header -->
      <div
        id="detail-header"
        class="bg-white border border-slate-100 rounded-3xl p-6 md:p-8 shadow-sm mb-8"
      >
        <div class="animate-pulse flex flex-col gap-4">
          <div class="h-6 bg-slate-200 rounded w-3/4"></div>
          <div class="h-4 bg-slate-200 rounded w-1/2"></div>
        </div>
      </div>

      <!-- Golden Hour Timeline Section -->
      <section
        class="bg-white border border-slate-100 rounded-3xl p-6 md:p-8 shadow-sm mb-8"
      >
        <h2
          class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2"
        >
          <span>☀️ Golden Hour & Sunlight Planner</span>
        </h2>
        <div id="sun-timeline" class="space-y-6">
          <div class="text-slate-500 text-sm py-4">
            Calculating sunlight and golden hour windows...
          </div>
        </div>
      </section>
    </main>

    <footer
      class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-500"
      id="main-footer"
    ></footer>
  </body>
</html>
