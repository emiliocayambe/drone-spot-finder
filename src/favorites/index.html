<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.ico" />
    <title>Drone Spot Finder | Favorite Spots</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/favorites.js" type="module"></script>
  </head>
  <body
    class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col justify-between"
  >
    <header
      class="bg-white shadow-sm sticky top-0 z-50"
      id="main-header"
    ></header>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
      <div class="mb-8">
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 mb-2">
          Favorite Spots
        </h1>
        <p class="text-sm text-slate-500">
          Quickly access your saved flying locations and check golden hour
          conditions.
        </p>
      </div>

      <!-- Favorites Grid Container -->
      <section>
        <div
          id="favorites-grid"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
        >
          <!-- Dynamically populated -->
        </div>
      </section>
    </main>

    <footer
      class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-500"
      id="main-footer"
    ></footer>
  </body>
</html>
